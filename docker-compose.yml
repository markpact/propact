services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: propact-dev
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - PROPACT_ENV=development
      - PORT=8000
      - HOST=0.0.0.0
    command: ["python", "-m", "propact.dev_server", "--host", "0.0.0.0", "--port", "8000", "--reload"]
